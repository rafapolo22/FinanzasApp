{% extends "layout.html" %}
{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-8">
        <div class="card shadow border-0">
            <div class="card-header bg-primary text-white py-3">
                <h4 class="mb-0"><i class="fas fa-coins me-2"></i>{{ _('convertidor_divisas') }}</h4>
            </div>
            <div class="card-body p-4">
                <div class="row g-3 align-items-end">
                    <div class="col-md-4">
                        <label class="form-label fw-bold text-muted">{{ _('monto') }}</label>
                        <input type="number" id="monto" class="form-control form-control-lg" placeholder="100.00" value="100">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold text-muted">{{ _('divisa_origen') }}</label>
                        <select id="origen" class="form-select form-select-lg">
                            <option value="USD" selected>USD - Dólar Estadounidense</option>
                            <option value="EUR">EUR - Euro</option>
                            <option value="GBP">GBP - Libra Esterlina</option>
                            <option value="JPY">JPY - Yen Japonés</option>
                            <option value="MXN">MXN - Peso Mexicano</option>
                            <option value="BRL">BRL - Real Brasileño</option>
                            <option value="CAD">CAD - Dólar Canadiense</option>
                            <option value="AUD">AUD - Dólar Australiano</option>
                            <option value="CHF">CHF - Franco Suizo</option>
                            <option value="CNY">CNY - Yuan Chino</option>
                            <option value="COP">COP - Peso Colombiano</option>
                            <option value="ILS">ILS - Shekel Israelí</option>
                            <option value="INR">INR - Rupia India</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold text-muted">{{ _('divisa_destino') }}</label>
                        <select id="destino" class="form-select form-select-lg">
                            <option value="EUR" selected>EUR - Euro</option>
                            <option value="USD">USD - Dólar Estadounidense</option>
                            <option value="GBP">GBP - Libra Esterlina</option>
                            <option value="JPY">JPY - Yen Japonés</option>
                            <option value="MXN">MXN - Peso Mexicano</option>
                            <option value="BRL">BRL - Real Brasileño</option>
                            <option value="CAD">CAD - Dólar Canadiense</option>
                            <option value="AUD">AUD - Dólar Australiano</option>
                            <option value="CHF">CHF - Franco Suizo</option>
                            <option value="CNY">CNY - Yuan Chino</option>
                            <option value="COP">COP - Peso Colombiano</option>
                            <option value="ILS">ILS - Shekel Israelí</option>
                            <option value="INR">INR - Rupia India</option>
                        </select>
                    </div>
                </div>

                <div id="resultado-container" class="mt-5 p-4 rounded-3 text-center border bg-light shadow-sm" style="display: none;">
                    <p class="text-muted mb-2 small text-uppercase fw-bold">{{ _('resultado_conversion') }}</p>
                    <h1 id="resultado-texto" class="display-4 text-primary mb-0 fw-bold"></h1>
                </div>

                <div id="loading" class="mt-5 text-center" style="display: none;">
                    <div class="spinner-border text-primary mb-2" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="text-muted mt-2 fw-semibold" id="loading-texto">{{ _('cargando') }}</p>
                </div>
            </div>
            <div class="card-footer bg-transparent border-0 text-center pb-4">
                <p class="text-muted small mb-0">
                    <i class="fas fa-info-circle me-1"></i> 
                    Datos actualizados en tiempo real mediante <strong>Frankfurter API</strong>.
                </p>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const montoInput = document.getElementById('monto');
    const origenSelect = document.getElementById('origen');
    const destinoSelect = document.getElementById('destino');
    const resultadoContainer = document.getElementById('resultado-container');
    const resultadoTexto = document.getElementById('resultado-texto');
    const loading = document.getElementById('loading');

    let debounceTimer;

    function convertir() {
        const monto = montoInput.value;
        const origen = origenSelect.value;
        const destino = destinoSelect.value;

        if (!monto || monto <= 0) {
            resultadoContainer.style.display = 'none';
            return;
        }

        if (origen === destino) {
            resultadoTexto.innerText = `${monto} ${origen} = ${monto} ${destino}`;
            resultadoContainer.style.display = 'block';
            loading.style.display = 'none';
            return;
        }

        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
            loading.style.display = 'block';
            resultadoContainer.style.display = 'none';

            console.log(`Realizando petición de conversión: https://api.frankfurter.app/latest?amount=${monto}&from=${origen}&to=${destino}`);
            fetch(`https://api.frankfurter.app/latest?amount=${monto}&from=${origen}&to=${destino}`)
                .then(response => {
                    console.log('Respuesta HTTP recibida de Frankfurter API:', response.status, response.statusText);
                    if (!response.ok) {
                        throw new Error(`Error HTTP: ${response.status} ${response.statusText}`);
                    }
                    return response.json();
                })
                .then(data => {
                    console.log('Datos de conversión exitosos:', data);
                    const resultado = data.rates[destino];
                    if (resultado === undefined) {
                        throw new Error(`La divisa de destino (${destino}) no está en las tasas devueltas por la API.`);
                    }
                    const formatMonto = new Intl.NumberFormat().format(monto);
                    const formatRes = new Intl.NumberFormat().format(resultado);
                    resultadoTexto.innerText = `${formatMonto} ${origen} = ${formatRes} ${destino}`;
                    resultadoContainer.style.display = 'block';
                    loading.style.display = 'none';
                })
                .catch(error => {
                    console.error('Error al realizar la conversión de divisas:', error);
                    console.log('Detalles del error de conversión:', {
                        monto: monto,
                        origen: origen,
                        destino: destino,
                        mensajeError: error.message
                    });
                    resultadoTexto.innerText = "{{ _('error_conversion') }}";
                    resultadoContainer.style.display = 'block';
                    loading.style.display = 'none';
                });
        }, 300);
    }

    montoInput.addEventListener('input', convertir);
    origenSelect.addEventListener('change', convertir);
    destinoSelect.addEventListener('change', convertir);

    // Primera conversión al cargar
    convertir();
});
</script>
{% endblock %}
