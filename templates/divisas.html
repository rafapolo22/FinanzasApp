{% extends "layout.html" %}
{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0"><i class="fas fa-exchange-alt me-2"></i>{{ _('convertidor_divisas') }}</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">{{ _('monto_a_convertir') }}</label>
                        <input type="number" step="0.01" name="monto" class="form-control" required value="{{ monto if monto else '' }}" placeholder="0.00">
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">{{ _('divisa_origen') }}</label>
                            <select name="origen" class="form-select">
                                <option value="USD" {% if origen == 'USD' %}selected{% endif %}>USD - Dólar Estadounidense</option>
                                <option value="EUR" {% if origen == 'EUR' %}selected{% endif %}>EUR - Euro</option>
                                <option value="GBP" {% if origen == 'GBP' %}selected{% endif %}>GBP - Libra Esterlina</option>
                                <option value="JPY" {% if origen == 'JPY' %}selected{% endif %}>JPY - Yen Japonés</option>
                                <option value="MXN" {% if origen == 'MXN' %}selected{% endif %}>MXN - Peso Mexicano</option>
                                <option value="BRL" {% if origen == 'BRL' %}selected{% endif %}>BRL - Real Brasileño</option>
                                <option value="CAD" {% if origen == 'CAD' %}selected{% endif %}>CAD - Dólar Canadiense</option>
                                <option value="AUD" {% if origen == 'AUD' %}selected{% endif %}>AUD - Dólar Australiano</option>
                                <option value="CHF" {% if origen == 'CHF' %}selected{% endif %}>CHF - Franco Suizo</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">{{ _('divisa_destino') }}</label>
                            <select name="destino" class="form-select">
                                <option value="EUR" {% if destino == 'EUR' %}selected{% endif %}>EUR - Euro</option>
                                <option value="USD" {% if destino == 'USD' %}selected{% endif %}>USD - Dólar Estadounidense</option>
                                <option value="GBP" {% if destino == 'GBP' %}selected{% endif %}>GBP - Libra Esterlina</option>
                                <option value="JPY" {% if destino == 'JPY' %}selected{% endif %}>JPY - Yen Japonés</option>
                                <option value="MXN" {% if destino == 'MXN' %}selected{% endif %}>MXN - Peso Mexicano</option>
                                <option value="BRL" {% if destino == 'BRL' %}selected{% endif %}>BRL - Real Brasileño</option>
                                <option value="CAD" {% if destino == 'CAD' %}selected{% endif %}>CAD - Dólar Canadiense</option>
                                <option value="AUD" {% if destino == 'AUD' %}selected{% endif %}>AUD - Dólar Australiano</option>
                                <option value="CHF" {% if destino == 'CHF' %}selected{% endif %}>CHF - Franco Suizo</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="fas fa-sync me-2"></i>{{ _('convertir') }}
                    </button>
                </form>

                {% if resultado %}
                <div class="mt-4 p-3 bg-light rounded border text-center">
                    <h5 class="text-muted">{{ _('resultado_conversion') }}:</h5>
                    <h2 class="text-primary mb-0 font-monospace">{{ monto }} {{ origen }} = {{ resultado }} {{ destino }}</h2>
                </div>
                {% endif %}
            </div>
        </div>
        <div class="mt-3 text-muted small text-center">
            <i class="fas fa-info-circle"></i> Datos proporcionados en tiempo real por Frankfurter API.
        </div>
    </div>
</div>
{% endblock %}
